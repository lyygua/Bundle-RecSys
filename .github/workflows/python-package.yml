name: Project checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints-tested.txt
          python -m pip install --no-deps -e .
      - name: Check package contents
        run: python scripts/verify_package.py
      - name: Check imports and command-line entry points
        run: |
          python run_recbole.py --help
          python predict_sasrec_topk.py --help
          python extract_amazon_target_user_content.py --help
          python prepare_amazon.py --help
      - name: Run focused tests using local fixtures
        run: python -m pytest -q tests/project tests/metrics tests/data tests/config/test_config.py
